<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — APOLLO</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/main.css" />
  </head>
  <body class="auth-body">
    <div class="auth-card">
      <div class="auth-left">
        <img src="assets/images/auth-illustration.svg" alt="Estudante estudando em frente ao computador" class="auth-illustration" />
      </div>

      <div class="auth-right">
        <div class="brand-logo">
          <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
            <circle cx="48" cy="12" r="5" fill="#F9AB00" />
            <circle cx="62" cy="6" r="4" fill="#22c55e" />
            <circle cx="76" cy="10" r="5" fill="#3b82f6" />
            <circle cx="88" cy="18" r="4" fill="#ef4444" />
            <circle cx="56" cy="4" r="3" fill="#a855f7" />
            <path d="M20 50 Q60 32 100 50" fill="none" stroke="#0C447C" stroke-width="4.5" stroke-linecap="round" />
            <path d="M20 58 Q60 40 100 58" fill="none" stroke="#0C447C" stroke-width="4" stroke-linecap="round" opacity=".75" />
            <path d="M20 66 Q60 48 100 66" fill="none" stroke="#1A6BBF" stroke-width="3.5" stroke-linecap="round" opacity=".55" />
            <line x1="60" y1="32" x2="60" y2="72" stroke="#0C447C" stroke-width="2.5" opacity=".4" />
            <path d="M18 68 Q60 50 102 68 L100 74 Q60 56 20 74 Z" fill="#0C447C" opacity=".12" />
          </svg>
          <span class="brand-logo-text">APOLLO</span>
        </div>

        <h1 class="auth-title">Bem-vindo!</h1>
        <p class="auth-sub">Faça login para continuar</p>

        <form class="auth-form" id="login-form">
          <p class="auth-error" id="login-erro" style="display: none"></p>
          <div class="input-wrap">
            <input type="text" id="login-email" placeholder="E-mail ou matrícula" required autocomplete="username" />
          </div>
          <div class="input-wrap">
            <input type="password" id="login-senha" placeholder="Senha" required autocomplete="current-password" />
          </div>
          <div class="forgot">
            <a href="recuperar-senha.html">Esqueceu a senha?</a>
          </div>
          <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <p class="auth-footer">Novo aqui? <a href="#">Criar conta</a></p>
      </div>
    </div>

    <script type="module" src="js/login.js"></script>
  </body>
</html>
